<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wachturm GUI-Demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#f6f7f9;--surface:#ffffff;--surface-1:#f1f3f5;--border:#dde1e6;--text:#1c1f23;--muted:#5f6670;--accent:#1f6feb;--accent-bg:#e3eeff;--danger:#c62828;--danger-bg:#fdecec;--warn:#8a5a00;--warn-bg:#fff4d6;--ok:#1b7f3b;--ok-bg:#e5f6ea;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--surface:#161b22;--surface-1:#1d232c;--border:#2d343e;--text:#e6edf3;--muted:#9aa4b0;--accent:#6ea8ff;--accent-bg:#1a2b47;--danger:#ff8a80;--danger-bg:#3a1b1b;--warn:#f2c35b;--warn-bg:#3a2e12;--ok:#7ad495;--ok-bg:#16301f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",sans-serif;padding:24px 16px}
.wt{max-width:900px;margin:auto;display:grid;grid-template-columns:170px minmax(0,1fr);border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.nav{background:var(--surface-1);padding:12px 8px;border-right:1px solid var(--border)}
.brand{font-weight:600;font-size:16px;padding:4px 10px 14px;display:flex;gap:8px;align-items:center}
.brand img{width:28px;height:28px;object-fit:contain;display:none}
.nav button{display:flex;gap:8px;align-items:center;width:100%;border:none;background:transparent;padding:9px 10px;font:inherit;font-size:14px;color:var(--muted);border-radius:8px;cursor:pointer;text-align:left}
.nav button:hover{background:var(--surface)}
.nav button.on{background:var(--accent-bg);color:var(--accent)}
.main{padding:18px 20px;min-height:440px}
input{flex:1;height:36px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
.btn{height:36px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.btn:hover{background:var(--surface-1)}
.row{display:grid;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:center}
.pill{font-size:12px;padding:2px 8px;border-radius:8px;white-space:nowrap;justify-self:start}
.crit{background:var(--danger-bg);color:var(--danger)}.med{background:var(--warn-bg);color:var(--warn)}.low{background:var(--accent-bg);color:var(--accent)}
.bar{height:6px;background:var(--surface-1);border-radius:3px;overflow:hidden;margin:12px 0 6px}
.bar div{height:100%;width:0;background:var(--accent);transition:width .1s}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.metric{background:var(--surface-1);border-radius:8px;padding:10px 12px}
.metric span{font-size:12px;color:var(--muted)}.metric b{display:block;font-size:22px;font-weight:600}
h3{font-size:14px;margin:16px 0 2px}
.note{max-width:900px;margin:12px auto 0;font-size:12px;color:var(--muted)}
@media (max-width:600px){.wt{grid-template-columns:1fr}.nav{display:flex;border-right:none;border-bottom:1px solid var(--border);overflow-x:auto}.brand{display:none}}
</style>
</head>
<body>
<div class="wt">
  <div class="nav">
    <div class="brand"><img id="logo" src="logo.png" alt="" onload="this.style.display='block';document.getElementById('lh').style.display='none'"><i id="lh" class="ti ti-building-lighthouse" style="font-size:22px"></i>Wachturm</div>
    <button class="on" data-v="net"><i class="ti ti-network"></i>Netzwerk</button>
    <button data-v="files"><i class="ti ti-folder"></i>Dateien</button>
    <button data-v="quar"><i class="ti ti-lock"></i>Quarantäne <span id="qcount" class="pill crit" style="margin-left:auto;display:none">0</span></button>
  </div>
  <div class="main" id="main"></div>
</div>
<p class="note">Demo mit Beispieldaten: Es wird nichts wirklich gescannt. Liegt eine logo.png im selben Ordner, erscheint sie oben links.</p>
<script>
const hosts=[["192.168.178.1","fritz.box","tcp/80"],["192.168.178.20","drucker","tcp/9100"],["192.168.178.34","nas","tcp/445"],["192.168.178.51","handy","arp"],["192.168.178.77","kamera","tcp/23"]];
const finds=[["crit","KRITISCH","192.168.178.77:23","Telnet offen (unverschlüsselt)"],["med","MITTEL","192.168.178.34:445","SMB-Freigabe erreichbar"],["med","MITTEL","192.168.178.34:22","Veraltetes OpenSSH 7.4"],["low","NIEDRIG","192.168.178.1:80","Webinterface ohne HTTPS"]];
const files=[["rechnung.pdf.exe",110,"Doppelte Endung, gepackt, neu"],["update_helper.ps1",100,"YARA: PowerShell-Download, neu"],["setup_spiel.exe",60,"Gepackt, neu"],["notizen.txt",20,"Neu"]];
let quar=[],netDone=false,fileDone=false;
const M=document.getElementById('main');
const metric=(l,v)=>`<div class="metric"><span>${l}</span><b>${v}</b></div>`;
function run(cb){const b=document.querySelector('.bar div');let p=0;const t=setInterval(()=>{p+=4;b.style.width=p+'%';document.getElementById('pct').textContent=p+' %';if(p>=100){clearInterval(t);cb()}},40)}
function net(){
  M.innerHTML=`<div style="display:flex;gap:10px"><input id="target" value="192.168.178.0/24"><button class="btn" id="go">Netz prüfen</button></div><div id="err" style="font-size:13px;color:var(--danger);min-height:4px;margin-top:4px"></div><div class="bar"><div></div></div><div class="mono" id="pct">${netDone?'100 %':'Bereit'}</div><div id="res"></div>`;
  document.getElementById('target').oninput=()=>document.getElementById('err').textContent='';
  document.getElementById('go').onclick=()=>{const v=document.getElementById('target').value.trim();if(!/^\d{1,3}(\.\d{1,3}){3}(\/\d{1,2})?$/.test(v)){document.getElementById('err').textContent='Gib ein Netz wie 192.168.178.0/24 ein';return}run(()=>{netDone=true;showNet()})};
  if(netDone){document.querySelector('.bar div').style.width='100%';showNet()}
}
function showNet(){
  document.getElementById('res').innerHTML=`<div class="metrics">${metric('Geräte',5)}${metric('Offene Ports',14)}${metric('Funde',4)}</div><h3>Funde</h3>`+
  finds.map(f=>`<div class="row" style="grid-template-columns:86px 160px 1fr"><span class="pill ${f[0]}">${f[1]}</span><span class="mono">${f[2]}</span><span>${f[3]}</span></div>`).join('')+
  `<h3>Geräte</h3>`+hosts.map(h=>`<div class="row" style="grid-template-columns:140px 1fr 80px"><span class="mono">${h[0]}</span><span>${h[1]}</span><span class="mono">${h[2]}</span></div>`).join('');
}
function fl(){
  M.innerHTML=`<div style="display:flex;gap:10px"><input value="C:\\Users\\du\\Downloads"><button class="btn" id="go">Ordner prüfen</button></div><div class="bar"><div></div></div><div class="mono" id="pct">${fileDone?'100 %':'Baseline vorhanden'}</div><div id="res"></div>`;
  document.getElementById('go').onclick=()=>run(()=>{if(!fileDone){fileDone=true;files.filter(f=>f[1]>=80).forEach(f=>quar.push({n:f[0],id:Math.random().toString(16).slice(2,10)}));updQ()}showFiles()});
  if(fileDone){document.querySelector('.bar div').style.width='100%';showFiles()}
}
function showFiles(){
  document.getElementById('res').innerHTML=`<div class="metrics">${metric('Neu',4)}${metric('Auffällig',4)}${metric('In Quarantäne',quar.length)}</div>`+
  files.map(f=>{const c=f[1]>=80?'crit':f[1]>=40?'med':'low';const q=quar.find(x=>x.n===f[0]);return `<div class="row" style="grid-template-columns:50px minmax(0,1fr) 110px"><span class="pill ${c}">${f[1]}</span><span><div>${f[0]}</div><div style="font-size:12px;color:var(--muted)">${f[2]}</div></span><span style="font-size:12px;color:${q?'var(--danger)':'var(--muted)'}">${q?'in Quarantäne':'nur gemeldet'}</span></div>`}).join('');
}
function qu(){
  if(!quar.length){M.innerHTML=`<div style="text-align:center;padding:70px 0;color:var(--muted)"><i class="ti ti-shield-check" style="font-size:28px"></i><div style="margin-top:8px">Quarantäne ist leer</div><div style="font-size:13px">Prüfe einen Ordner unter „Dateien“, um die Quarantäne zu füllen.</div></div>`;return}
  M.innerHTML=`<div style="font-size:13px;color:var(--muted);margin-bottom:6px">Verschlüsselt mit AES-256, nicht ausführbar</div>`+
  quar.map((q,i)=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto auto"><span><div>${q.n}</div><div class="mono">${q.id}</div></span><button class="btn" data-r="${i}">Wiederherstellen</button><button class="btn" data-d="${i}" style="color:var(--danger)">Löschen</button></div>`).join('');
  M.querySelectorAll('[data-r],[data-d]').forEach(b=>b.onclick=()=>{quar.splice(+(b.dataset.r??b.dataset.d),1);updQ();qu()});
}
function updQ(){const e=document.getElementById('qcount');e.textContent=quar.length;e.style.display=quar.length?'inline-block':'none'}
const views={net,files:fl,quar:qu};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');views[b.dataset.v]()});
net();
</script>
</body>
</html>
